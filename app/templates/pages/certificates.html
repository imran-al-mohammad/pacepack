{% extends "base.html" %}
{% block content %}
  <section class="panel">
    <div class="panel-header">
      <h3>Certificates</h3>
      <p class="panel-hint">File upload only — JPG, PNG, WebP, or PDF. A logged result is required.</p>
    </div>
    <form class="results-toolbar" method="get" action="/certificates">
      <label class="field">
        <span>Select a race</span>
        <select class="select full" name="race_id" hx-get="/certificates/partial" hx-target="#certificates-panel" hx-include="closest form" hx-push-url="true">
          {% for item in races %}
            <option value="{{ item.id }}" {% if race and item.id == race.id %}selected{% endif %}>
              {{ item.name }} ({{ item.race_date }}) — {{ item.entry_count }} registered
            </option>
          {% endfor %}
        </select>
      </label>
    </form>

    <div id="certificates-panel">
      {% include "partials/certificates.html" %}
    </div>
  </section>
{% endblock %}
