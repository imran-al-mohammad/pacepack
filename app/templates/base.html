<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ title }} · PacePack</title>
  <meta name="theme-color" content="#151515">
  <meta name="description" content="{{ desc }}">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <div class="app" id="app-shell">
    {% include "partials/topnav.html" %}
    {% include "partials/sidebar.html" %}
    <main class="main">
      <div class="topbar">
        <div class="topbar-left">
          <div class="topbar-titles">
            <h2>{{ title }}</h2>
            <p class="view-desc">{{ desc }}</p>
          </div>
        </div>
        <div class="topbar-actions">
          {% block actions %}{% endblock %}
        </div>
      </div>
      {% include "partials/flash.html" %}
      <div class="view active">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
</body>
</html>
